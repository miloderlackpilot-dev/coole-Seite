<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Milo's Games</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#008080;font-family:"MS Sans Serif",Arial,sans-serif;font-size:13px}.desktop{min-height:100vh;padding:35px 20px 55px}.window{max-width:760px;margin:0 auto;background:#c0c0c0;border:2px solid #fff;border-right-color:#000;border-bottom-color:#000;box-shadow:5px 5px #000}.title{margin:2px 2px 0;padding:5px 7px;background:#000080;color:#fff;font-weight:bold}.body{padding:14px}.games{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.game{background:#ddd;border:2px solid #fff;border-right-color:#404040;border-bottom-color:#404040;padding:18px;text-align:center;cursor:pointer}.game:hover{background:#000080;color:#fff}.game b{display:block;font-size:28px;margin-bottom:8px}.panel{display:none;margin-top:14px;padding:12px;background:#eee;border:2px inset #fff}.panel.active{display:block}.close{float:right}.board{display:grid;grid-template-columns:repeat(8,30px);gap:2px;margin:12px auto;width:max-content}.cell{width:30px;height:30px;background:#c0c0c0;border:2px solid #fff;border-right-color:#555;border-bottom-color:#555;font-weight:bold}.snake-wrap{background:#111;width:320px;max-width:100%;margin:auto;padding:6px}.snake-wrap canvas{display:block;width:100%;image-rendering:pixelated}.pong{text-align:center}.pong canvas{max-width:100%;background:#000;border:2px inset #fff}.hint{font-size:11px}.back{display:inline-block;margin-top:12px;color:#000;background:#c0c0c0;padding:5px 10px;border:2px solid #fff;border-right-color:#404040;border-bottom-color:#404040;text-decoration:none}
</style>
</head>
<body><div class="desktop"><div class="window"><div class="title">MILO'S GAME CENTER.EXE</div><div class="body"><h2>★ MINI GAMES ★</h2><p>Choose a game and waste some time like it's 1998.</p><div class="games"><div class="game" onclick="openGame('mine')"><b>💣</b>Minesweeper</div><div class="game" onclick="openGame('snake')"><b>🐍</b>Snake</div><div class="game" onclick="openGame('pong')"><b>🏓</b>Pong</div></div><div id="mine" class="panel"><button class="close" onclick="closeGame('mine')">X</button><b>MINESWEEPER</b><p id="mine-status">Find 10 mines.</p><div id="board" class="board"></div><button onclick="newMines()">New Game</button></div><div id="snake" class="panel"><button class="close" onclick="closeGame('snake')">X</button><b>SNAKE</b><p class="hint">Use arrow keys. Press Space to restart.</p><div class="snake-wrap"><canvas id="snakeCanvas" width="320" height="240"></canvas></div></div><div id="pong" class="panel"><button class="close" onclick="closeGame('pong')">X</button><b>PONG</b><p class="hint">Move your mouse over the game to control the paddle.</p><div class="pong"><canvas id="pongCanvas" width="480" height="280"></canvas></div></div><a class="back" href="index.html">← Back to Desktop</a></div></div></div>
<script>
function openGame(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='mine')newMines();if(id==='snake')startSnake();if(id==='pong')startPong()}
function closeGame(id){document.getElementById(id).classList.remove('active')}
let mineMap=[];function newMines(){let b=document.getElementById('board');b.innerHTML='';mineMap=Array(64).fill(0);let placed=0;while(placed<10){let i=Math.floor(Math.random()*64);if(!mineMap[i]){mineMap[i]=1;placed++}}for(let i=0;i<64;i++){let c=document.createElement('button');c.className='cell';c.onclick=()=>{if(mineMap[i]){c.textContent='💣';document.getElementById('mine-status').textContent='BOOM! Game over.'}else{c.textContent='';let n=0;for(let d of [-1,1,-8,8]){let j=i+d;if(j>=0&&j<64&&Math.abs((j%8)-(i%8))<=1&&mineMap[j])n++}c.textContent=n||'·'}};b.appendChild(c)}document.getElementById('mine-status').textContent='Find 10 mines.'}
let snakeTimer;function startSnake(){clearInterval(snakeTimer);let c=document.getElementById('snakeCanvas'),x=c.getContext('2d'),s=[{x:8,y:6},{x:7,y:6},{x:6,y:6}],d={x:1,y:0},food={x:15,y:8};function draw(){x.fillStyle='#111';x.fillRect(0,0,320,240);x.fillStyle='#00ff00';s.forEach(p=>x.fillRect(p.x*16,p.y*16,14,14));x.fillStyle='#ff4444';x.fillRect(food.x*16,food.y*16,14,14)}function tick(){let h={x:s[0].x+d.x,y:s[0].y+d.y};if(h.x<0||h.y<0||h.x>=20||h.y>=15||s.some(p=>p.x===h.x&&p.y===h.y)){clearInterval(snakeTimer);return}s.unshift(h);if(h.x===food.x&&h.y===food.y){food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*15)}}else s.pop();draw()}document.onkeydown=e=>{if(e.key==='ArrowUp'&&d.y!==1)d={x:0,y:-1};if(e.key==='ArrowDown'&&d.y!==-1)d={x:0,y:1};if(e.key==='ArrowLeft'&&d.x!==1)d={x:-1,y:0};if(e.key==='ArrowRight'&&d.x!==-1)d={x:1,y:0};if(e.code==='Space')startSnake()};draw();snakeTimer=setInterval(tick,110)}
let pongTimer;function startPong(){clearInterval(pongTimer);let c=document.getElementById('pongCanvas'),x=c.getContext('2d'),py=110,by=140,bx=240,dx=3,dy=2,score=0;function draw(){x.fillStyle='#000';x.fillRect(0,0,480,280);x.fillStyle='#fff';x.fillRect(15,py,8,60);x.fillRect(457,by,8,60);x.fillRect(bx,by+20,10,10);x.font='24px monospace';x.fillText(score,220,35)}c.onmousemove=e=>{let r=c.getBoundingClientRect();py=Math.max(0,Math.min(220,(e.clientY-r.top)*280/r.height-30))};function tick(){bx+=dx;by+=dy;if(by<0||by>270)dy*=-1;if(bx<25&&by>py-10&&by<py+70){dx=Math.abs(dx);score++}if(bx>450&&by>by-1){dx=-Math.abs(dx)}if(bx<0||bx>480){bx=240;by=140;dx=3}draw()}draw();pongTimer=setInterval(tick,16)}
</script></body></html>
